<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chatbot IA style ChatGPT avec API OpenAI</title>
<style>
  :root {
  --primary: #10b981;
  --primary-dark: #059669;
  --primary-light: #34d399;
  --primary-lighter: #6ee7b7;
  --primary-lightest: #d1fae5;
  --background: #f9fafb;
  --foreground: #111827;
  --muted: #6b7280;
  --muted-light: #9ca3af;
  --border: #e5e7eb;
  --card: #ffffff;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
  --success: #10b981;
}

/* RESET */
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--background);
  color: var(--foreground);
}

/* Bouton flottant */
#chatbotToggle {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 60px;
  height: 60px;
  background: var(--primary);
  border-radius: 50%;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
  z-index: 1000;
}
#chatbotToggle:hover {
  background: var(--primary-dark);
  box-shadow: 0 6px 18px rgba(5, 150, 105, 0.7);
}
#chatbotToggle svg {
  width: 28px;
  height: 28px;
  fill: white;
}

/* Chatbot container */
.chatbot {
  position: fixed;
  bottom: 100px;
  right: 30px;
  width: 360px;
  max-height: 600px;
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  z-index: 999;
}
.chatbot.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

/* Header */
.chatbot-header {
  background: var(--primary);
  color: var(--card);
  padding: 18px 20px;
  font-weight: 700;
  font-size: 1.3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#closeChatbot {
  cursor: pointer;
  background: transparent;
  border: none;
  color: var(--card);
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  transition: color 0.3s ease;
}
#closeChatbot:hover {
  color: var(--primary-lightest);
}

/* Corps du chat */
.chatbot-body {
  padding: 20px;
  background: var(--primary-lightest);
  height: 380px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Messages */
.message {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.message.bot {
  background: white;
  color: black;
  align-self: flex-start;
}
.message.user {
  background: black;
  color: white;
  align-self: flex-end;
}

/* Footer */
.chatbot-footer {
  display: flex;
  align-items: center;
  padding: 10px;
  border-top: 1px solid var(--border);
  background: var(--card);
  position: relative;
  box-sizing: border-box;
}
.chatbot-footer input[type="text"] {
  flex: 1;
  padding: 10px 12px 10px 14px;
  font-size: 15px;
  border: 1.5px solid var(--border);
  border-radius: 9999px;
  outline: none;
  color: var(--foreground);
  transition: border-color 0.25s ease;
}
.chatbot-footer input[type="text"]:focus {
  border-color: var(--primary);
}

/* Bouton + */
#btnPlus {
  background: var(--primary-lightest);
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  margin-left: 10px;
  cursor: pointer;
  font-size: 24px;
  line-height: 0;
  color: var(--primary-dark);
  transition: background-color 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
#btnPlus:hover {
  background: var(--primary-light);
  color: var(--card);
}

/* Bouton envoyer */
#btnSend {
  background: var(--primary);
  border: none;
  border-radius: 9999px;
  color: var(--card);
  padding: 8px 14px;
  margin-left: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  transition: background-color 0.25s ease;
  height: 36px;
}
#btnSend:hover {
  background: var(--primary-dark);
}

/* Menu + */
.chatbot-menu {
  position: absolute;
  bottom: 54px;
  right: 60px;
  background: var(--card);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  padding: 8px 10px;
  display: flex;
  gap: 12px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 1000;
}
.chatbot-menu.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
.chatbot-menu button {
  background: var(--primary-lightest);
  border: none;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.3s ease;
}
.chatbot-menu button:hover {
  background: var(--primary-light);
}
.chatbot-menu svg {
  width: 22px;
  height: 22px;
  fill: var(--primary-dark);
}

</style>
</head>
<body>

<!-- Bouton flottant ouvrir chatbot -->
<div id="chatbotToggle" title="Ouvrir le chatbot IA" aria-label="Ouvrir le chatbot IA" role="button" tabindex="0">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M4 4h16v12H5.17L4 17.17V4z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M22 6v12a2 2 0 0 1-2 2H6l-4 4V6a2 2 0 0 1 2-2h16z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
</div>

<!-- Chatbot -->
<div class="chatbot" id="chatbot" role="dialog" aria-modal="true" aria-labelledby="chatbotTitle" aria-describedby="chatbotDesc">
  <div class="chatbot-header" id="chatbotTitle">
    IA Chat
    <button id="closeChatbot" aria-label="Fermer le chatbot" title="Fermer le chatbot">&times;</button>
  </div>

  <div class="chatbot-body" id="chatbotDesc" tabindex="0" aria-live="polite" aria-relevant="additions">
    <!-- Messages -->
  </div>

  <form class="chatbot-footer" id="chatbotForm" aria-label="Envoyer un message">
    <input type="text" id="chatInput" autocomplete="off" placeholder="Tapez votre message..." aria-label="Message utilisateur" required />
    <button type="button" id="btnPlus" aria-label="Plus d’options" title="Plus d’options">+</button>
    <button type="submit" id="btnSend" aria-label="Envoyer message">Envoyer</button>

    <!-- Menu + -->
    <div class="chatbot-menu" id="chatbotMenu" role="menu" aria-hidden="true">
      <button type="button" id="btnPhoto" aria-label="Envoyer une photo" title="Envoyer une photo" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM5 5h14v14H5V5zm7 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
        </svg>
      </button>
      <button type="button" id="btnCamera" aria-label="Utiliser la caméra" title="Utiliser la caméra" role="menuitem">
        <!-- Icône caméra classique modifiée -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M17 7h-1.586l-1.707-1.707A.996.996 0 0 0 13 5H9c-.265 0-.52.105-.707.293L6.586 7H5c-1.103 0-2 .897-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7c0-1.103-.897-2-2-2zM12 17a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
        </svg>
      </button>
      <button type="button" id="btnFile" aria-label="Envoyer un fichier" title="Envoyer un fichier" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM13 9V3.5L18.5 9H13z"/>
        </svg>
      </button>
    </div>
  </form>
</div>

<script>
  const toggleBtn = document.getElementById('chatbotToggle');
  const chatbot = document.getElementById('chatbot');
  const closeBtn = document.getElementById('closeChatbot');
  const chatbotMenu = document.getElementById('chatbotMenu');
  const btnPlus = document.getElementById('btnPlus');
  const chatbotBody = document.querySelector('.chatbot-body');
  const chatbotForm = document.getElementById('chatbotForm');
  const chatInput = document.getElementById('chatInput');

  // Ouvrir chatbot
  toggleBtn.addEventListener('click', () => {
    chatbot.classList.add('open');
    toggleBtn.style.display = 'none';
    chatInput.focus();
  });

  // Fermer chatbot
  closeBtn.addEventListener('click', () => {
    chatbot.classList.remove('open');
    toggleBtn.style.display = 'flex';
    chatbotMenu.classList.remove('open');
  });

  // Toggle menu + (options)
  btnPlus.addEventListener('click', e => {
    e.stopPropagation();
    chatbotMenu.classList.toggle('open');
  });

  // Clic hors menu ferme le menu
  document.addEventListener('click', () => {
    chatbotMenu.classList.remove('open');
  });

  // Empêche fermeture menu si clic dedans
  chatbotMenu.addEventListener('click', e => {
    e.stopPropagation();
  });

  // Actions boutons menu
  document.getElementById('btnPhoto').addEventListener('click', () => {
    alert("Action: Envoyer une photo (fonction à implémenter)");
    chatbotMenu.classList.remove('open');
  });
  document.getElementById('btnCamera').addEventListener('click', () => {
    alert("Action: Utiliser la caméra (fonction à implémenter)");
    chatbotMenu.classList.remove('open');
  });
  document.getElementById('btnFile').addEventListener('click', () => {
    alert("Action: Envoyer un fichier (fonction à implémenter)");
    chatbotMenu.classList.remove('open');
  });

  // Ajout message dans chat
  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.classList.add('message', sender);
    div.textContent = text;
    chatbotBody.appendChild(div);
    chatbotBody.scrollTop = chatbotBody.scrollHeight;
  }

  // API OpenAI - configuration
  const OPENAI_API_KEY = 'ta_clef_api_ici'; // <-- REMPLACE par ta clé OpenAI

  async function sendToOpenAI(message) {
    try {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [
            { role: "user", content: message }
          ],
          temperature: 0.7,
          max_tokens: 1000
        })
      });
      const data = await response.json();
      if (data.choices && data.choices.length > 0) {
        return data.choices[0].message.content.trim();
      } else {
        return "Désolé, je n'ai pas pu récupérer de réponse.";
      }
    } catch (error) {
      return "Erreur de communication avec l'IA.";
    }
  }

  // Envoyer message
  chatbotForm.addEventListener('submit', async e => {
    e.preventDefault();
    const msg = chatInput.value.trim();
    if (!msg) return;

    addMessage(msg, 'user');
    chatInput.value = '';
    chatbotMenu.classList.remove('open');

    addMessage("...", 'bot'); // Indicateur "en cours"

    // Appel API OpenAI
    const botMessages = chatbotBody.querySelectorAll('.message.bot');
    const lastBotMessage = botMessages[botMessages.length - 1];
    try {
      const response = await sendToOpenAI(msg);
      lastBotMessage.textContent = response;
    } catch (e) {
      lastBotMessage.textContent = "Erreur lors de la réponse.";
    }

    chatbotBody.scrollTop = chatbotBody.scrollHeight;
  });
</script>

</body>
</html>
